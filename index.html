<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Algorithms | Premium Storyboard</title>
    <!-- Font Space Grotesk & Inter untuk kesan modern tech -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base: #050505;
            --panel-bg: #121212;
            --panel-hover: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #2a2a2a;
            
            /* Animasi ala React Bits (Smooth & Bouncy) */
            --spring-easing: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-speed: 0.8s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 2rem;
            z-index: 10;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-weight: 300;
            margin-top: 0.5rem;
        }

        /* Container Accordion */
        .accordion-wrapper {
            display: flex;
            width: 95vw;
            max-width: 1400px;
            height: 70vh;
            min-height: 500px;
            gap: 10px;
            padding: 10px;
        }

        /* Individual Card/Panel */
        .panel {
            position: relative;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            cursor: pointer;
            overflow: hidden;
            flex: 0.5; /* Ukuran saat tertutup */
            transition: flex var(--transition-speed) var(--spring-easing), 
                        background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel:hover {
            background-color: var(--panel-hover);
        }

        .panel.active {
            flex: 5; /* Ukuran saat terbuka (membesar 10x lipat) */
            cursor: default;
            background-color: #181818;
            border-color: #444;
        }

        /* Konten Saat Tertutup (Vertikal) */
        .collapsed-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            transition: opacity 0.3s ease;
            opacity: 1;
            white-space: nowrap;
        }

        .panel.active .collapsed-content {
            opacity: 0;
            pointer-events: none;
        }

        .collapsed-content .icon-box {
            margin-bottom: 2rem;
            color: var(--text-secondary);
        }

        .collapsed-content h3 {
            font-family: 'Space Grotesk', sans-serif;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 1.2rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Konten Saat Terbuka (Expanded) */
        .expanded-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.5s var(--spring-easing);
            transition-delay: 0s;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.2) 100%);
        }

        .panel.active .expanded-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0.3s; /* Delay biar animasi buka kelar dulu */
        }

        .expanded-content .year-badge {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            align-self: flex-start;
        }

        .expanded-content h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .expanded-content p {
            font-size: 1.1rem;
            color: #cccccc;
            max-width: 600px;
            font-weight: 300;
            line-height: 1.6;
        }
        
        .citation {
            font-size: 0.75rem;
            opacity: 0.6;
            vertical-align: super;
        }

        /* Responsif untuk Mobile */
        @media (max-width: 800px) {
            .accordion-wrapper {
                flex-direction: column;
                height: 100vh;
                padding: 10px 20px;
            }
            .panel {
                flex: 0.5;
            }
            .panel.active {
                flex: 6;
            }
            .collapsed-content {
                flex-direction: row;
                width: 100%;
                justify-content: flex-start;
                padding-left: 20px;
            }
            .collapsed-content h3 {
                writing-mode: horizontal-tb;
                transform: none;
                margin-left: 15px;
            }
            .collapsed-content .icon-box {
                margin-bottom: 0;
            }
            .expanded-content h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Google Algorithm</h1>
        <p class="subtitle">Evolusi Cerdas Mesin Pencari (2011 - 2019)</p>
    </header>

    <div class="accordion-wrapper" id="accordion">
        <!-- Panel akan di-generate via JavaScript -->
    </div>

    <script>
        // Data 9 Algoritma dari Rangkuman
        const algorithms = [
            { id: 'pagerank', title: 'PageRank', year: 'Awal', icon: 'link', desc: 'Menentukan peringkat halaman berdasarkan jumlah dan kualitas tautan yang masuk. Tautan dari situs bereputasi tinggi meningkatkan kredibilitas <span class="citation"></span>.' },
            { id: 'panda', title: 'Panda', year: '2011', icon: 'file-text', desc: 'Menghukum situs dengan konten tipis, berulang, atau spammy. Mengutamakan konten orisinal dan berkualitas tinggi <span class="citation"></span>.' },
            { id: 'penguin', title: 'Penguin', year: '2012', icon: 'shield-alert', desc: 'Menghukum situs dengan teknik manipulatif seperti link farming. Memastikan hasil tidak didominasi situs spam atau manipulatif <span class="citation"></span>.' },
            { id: 'hummingbird', title: 'Hummingbird', year: '2013', icon: 'feather', desc: 'Memahami makna kontekstual kueri, bukan hanya kata kunci. Mendukung pencarian semantik dan kueri percakapan kompleks <span class="citation"></span>.' },
            { id: 'pigeon', title: 'Pigeon', year: '2014', icon: 'map-pin', desc: 'Menggabungkan sinyal SEO dan lokasi pengguna untuk menyajikan hasil bisnis lokal yang sangat relevan dan akurat <span class="citation"></span>.' },
            { id: 'mobile', title: 'Mobile-Friendly', year: '2015', icon: 'smartphone', desc: 'Situs responsif mendapat peringkat lebih tinggi. Situs yang tidak mobile-friendly kena penalti pada pencarian seluler <span class="citation"></span>.' },
            { id: 'rankbrain', title: 'RankBrain', year: '2015', icon: 'brain', desc: 'Menggunakan kecerdasan buatan (AI) untuk memahami kueri baru atau ambigu secara dinamis dan belajar dari data <span class="citation"></span>.' },
            { id: 'medic', title: 'Medic', year: '2018', icon: 'heart-pulse', desc: 'Fokus pada situs kesehatan & keuangan dengan menekankan E-A-T (Expertise, Authoritativeness, Trustworthiness) <span class="citation"></span>.' },
            { id: 'bert', title: 'BERT', year: '2019', icon: 'text-search', desc: 'Memahami konteks kata dari dua arah (bidirectional). Mampu menangkap makna sangat kompleks dalam kueri panjang <span class="citation"></span>.' }
        ];

        const accordion = document.getElementById('accordion');

        algorithms.forEach((algo, index) => {
            const panel = document.createElement('div');
            panel.className = `panel ${index === 0 ? 'active' : ''}`;
            
            // Struktur Konten
            panel.innerHTML = `
                <!-- Tampilan saat mengecil / collapsed -->
                <div class="collapsed-content">
                    <div class="icon-box"><i data-lucide="${algo.icon}" width="24" height="24"></i></div>
                    <h3>${algo.title}</h3>
                </div>

                <!-- Tampilan saat membesar / expanded -->
                <div class="expanded-content">
                    <div>
                        <span class="year-badge">${algo.year}</span>
                        <h2>${algo.title}</h2>
                        <p>${algo.desc}</p>
                    </div>
                </div>
            `;

            // Logika Klik untuk Expand
            panel.addEventListener('click', () => {
                removeActiveClasses();
                panel.classList.add('active');
            });

            accordion.appendChild(panel);
        });

        // Fungsi hapus class active dari semua panel
        function removeActiveClasses() {
            const panels = document.querySelectorAll('.panel');
            panels.forEach(panel => {
                panel.classList.remove('active');
            });
        }

        // Render Ikon dari Lucide
        lucide.createIcons();
    </script>
</body>
</html>
