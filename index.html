<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Konsep: Evolusi Algoritma Google</title>
    <!-- Font Premium: Playfair Display & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-dark: #111111;
            --gold-light: #fcf6ba;
            --gold-main: #d4af37;
            --gold-dark: #aa771c;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.4);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Simulasi background gelap premium */
            background: radial-gradient(circle at top center, #222 0%, #050505 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 3rem 2rem 1rem;
        }

        header h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-main);
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            /* Gradient Emas untuk Judul Utama */
            background: linear-gradient(to right, var(--gold-dark), var(--gold-light), var(--gold-main));
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Timeline Container */
        .timeline-wrapper {
            position: relative;
            width: 100%;
            padding: 8rem 2rem 10rem;
            overflow-x: auto;
            /* Menyembunyikan scrollbar tapi tetap bisa di-scroll */
            scrollbar-width: none; 
        }
        .timeline-wrapper::-webkit-scrollbar {
            display: none;
        }

        /* Garis emas yang menghubungkan antar kartu */
        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
            box-shadow: 0 0 15px var(--gold-main);
            z-index: 1;
        }

        .timeline-container {
            display: inline-flex;
            gap: 3rem;
            padding: 0 5rem;
            position: relative;
            z-index: 2;
            align-items: center;
        }

        /* Style Kartu Glassmorphism */
        .card {
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3.5rem 1.5rem 2rem;
            position: relative;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-light);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Efek Zig-zag (Selang-seling Atas Bawah seperti di gambar) */
        .card:nth-child(odd) {
            margin-top: -120px; /* Geser ke atas */
        }
        .card:nth-child(even) {
            margin-top: 120px; /* Geser ke bawah */
        }

        /* Lingkaran Ikon di Atas Kartu */
        .icon-wrapper {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: #111;
            border: 3px solid var(--gold-main);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.2), 0 10px 20px rgba(0,0,0,0.6);
            color: var(--gold-light);
        }

        /* Lingkaran Angka Kecil */
        .number-badge {
            position: absolute;
            bottom: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #000;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #111;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Teks di Dalam Kartu */
        .card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-light);
            font-size: 1.4rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            font-weight: 300;
        }

        .citation {
            font-size: 0.7rem;
            opacity: 0.5;
            vertical-align: super;
        }

        /* Responsif untuk HP (Ubah jadi vertikal biar tetap terbaca) */
        @media (max-width: 768px) {
            .timeline-wrapper {
                padding: 2rem 1rem;
            }
            .timeline-line {
                display: none; /* Sembunyikan garis horizontal di HP */
            }
            .timeline-container {
                display: flex;
                flex-direction: column;
                gap: 5rem;
                padding: 2rem 0;
            }
            .card:nth-child(odd), .card:nth-child(even) {
                margin-top: 0; /* Matikan efek zig-zag di HP */
            }
            header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>Peta Konsep:</h2>
        <h1>Evolusi Algoritma<br>Pencarian Google</h1>
        <p>Perjalanan Menuju Kualitas Pencarian Premium, Berkelas, dan Relevan</p>
    </header>

    <div class="timeline-wrapper">
        <div class="timeline-line"></div>
        
        <div class="timeline-container" id="timeline">
            <!-- Konten di-generate via JavaScript -->
        </div>
    </div>

    <script>
        // Data disusun sesuai urutan waktu/Peta Konsep
        const algorithms = [
            {
                id: 'pagerank',
                title: 'PageRank',
                year: 'Fondasi Awal',
                icon: 'link',
                desc: 'Menentukan peringkat halaman berdasarkan jumlah dan kualitas tautan. Tautan dari situs bereputasi tinggi memberi nilai lebih <span class="citation">[span_0](start_span)[span_0](end_span)</span>.'
            },
            {
                id: 'panda',
                title: 'Panda',
                year: '2011',
                icon: 'layout-template',
                desc: 'Menurunkan peringkat konten tipis, berulang, berkualitas rendah. Mengutamakan konten orisinal & informatif <span class="citation">[span_1](start_span)[span_1](end_span)</span>.'
            },
            {
                id: 'penguin',
                title: 'Penguin',
                year: '2012',
                icon: 'shield-alert',
                desc: 'Mengurangi peringkat situs manipulatif (link farming, keyword stuffing). Mendorong praktik SEO etis <span class="citation">[span_2](start_span)[span_2](end_span)</span>.'
            },
            {
                id: 'hummingbird',
                title: 'Hummingbird',
                year: '2013',
                icon: 'feather',
                desc: 'Memahami makna & konteks pencarian, bukan hanya kecocokan kata kunci. Hasil sesuai maksud pengguna <span class="citation">[span_3](start_span)[span_3](end_span)</span>.'
            },
            {
                id: 'pigeon',
                title: 'Pigeon',
                year: '2014',
                icon: 'map-pin',
                desc: 'Mengutamakan hasil pencarian lokal berdasarkan lokasi pengguna & relevansi (contoh: restoran terdekat) <span class="citation">[span_4](start_span)[span_4](end_span)</span>.'
            },
            {
                id: 'mobile',
                title: 'Mobile-Friendly',
                year: '2015',
                icon: 'smartphone',
                desc: 'Memberikan peringkat lebih baik pada situs yang tampil nyaman & responsif di layar kecil smartphone <span class="citation">[span_5](start_span)[span_5](end_span)</span>.'
            },
            {
                id: 'rankbrain',
                title: 'RankBrain',
                year: '2015',
                icon: 'cpu',
                desc: 'Menggunakan AI & machine learning untuk memahami pencarian baru atau ambigu dan memberikan hasil relevan <span class="citation">[span_6](start_span)[span_6](end_span)</span>.'
            },
            {
                id: 'medic',
                title: 'Medic Update',
                year: '2018',
                icon: 'heart-pulse',
                desc: 'Meningkatkan kualitas situs terutama pada topik kritis: kesehatan, keuangan, kesejahteraan (E-A-T) <span class="citation">[span_7](start_span)[span_7](end_span)</span>.'
            },
            {
                id: 'bert',
                title: 'BERT',
                year: '2019',
                icon: 'languages',
                desc: 'Memahami hubungan antarkata & konteks dua arah dalam kalimat. Menangkap maksud kueri kompleks dengan cerdas <span class="citation">[span_8](start_span)[span_8](end_span)</span>.'
            }
        ];

        const timelineContainer = document.getElementById('timeline');

        algorithms.forEach((algo, index) => {
            // Pembuatan elemen HTML untuk setiap kartu
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="icon-wrapper">
                    <i data-lucide="${algo.icon}" width="36" height="36" stroke-width="1.5"></i>
                    <div class="number-badge">${index + 1}</div>
                </div>
                <h3>${algo.title}<br><span style="font-size: 1rem; font-family: 'Inter', sans-serif; font-weight: 300;">(${algo.year})</span></h3>
                <p>${algo.desc}</p>
            `;

            timelineContainer.appendChild(card);
        });

        // Merender Ikon
        lucide.createIcons();
    </script>
</body>
</html>
